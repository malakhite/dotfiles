[perl]
symbol = " "

[php]
symbol = " "

[python]
symbol = " "

[rust]
symbol = "󱘗 "

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bg:cyan fg:black"
style_root = "red bold"
format = "[](fg:cyan)[$user]($style)"
disabled = false
show_always = true
