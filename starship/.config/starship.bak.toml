"$schema" = 'https://starship.rs/config-schema.json'

# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

# format = """
# $cmd_duration$username$hostname $directory $git_branch
# $character
# """
format = """
$os ($hostname )$directory $git_branch$git_status$git_state
$character"""

palette = "catppuccin_mocha"

add_newline = true

[aws]
symbol = " "

[azure]
symbol = "󰠅 "

[buf]
symbol = " "

[bun]
symbol = " "

[c]
symbol = " "

[character]
success_symbol = "[  ](fg:blue)"
error_symbol = "[  ](fg:red)"

[cmake]
symbol = " "

[conda]
symbol = " "

[cpp]
symbol = " "

[cmd_duration]
min_time = 0
format = '[](fg:yellow)[󰪢 $duration](bg:yellow fg:black)[](fg:yellow)'

[directory]
home_symbol = "  "
read_only = "  "
style = "bg:green fg:black"
truncation_length = 6
truncation_symbol = " ••/"
format = '[](fg:green)[󰉋 $path]($style)[](fg:green)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[docker_context]
symbol = " "

[gcloud]
symbol = " "

[git_branch]
style = "bg: cyan"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = "󰜥 [](fg:cyan)[$symbol $branch(:$remote_branch)](fg:black bg:cyan)[ ](fg:cyan)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](red)"

[git_status]
# conflicted = " 🏳 "
# ahead = " 🏎💨 "
# behind = " 😰 "
# diverged = " 😵 "
# untracked = " 🤷 ‍"
# stashed = " 📦 "
# modified = " 📝 "
# staged = '[++\($count\)](green)'
# renamed = " ✍️ "
# deleted = " 🗑 "

[gradle]
symbol = " "

[hostname]
ssh_only = true
ssh_symbol = " "
# format =  "[•$hostname](bg:cyan fg:black)[](fg:cyan)"
trim_at = ".companyname.com"
disabled = false

[java]
symbol = " "

[kotlin]
symbol = " "

[lua]
symbol = " "

[meson]
symbol = "󰔷 "

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = "󰍛 "
style = "bold dimmed green"

[nix_shell]
symbol = " "

[nodejs]
symbol = " "

[os]
disabled = false

[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
Arch = " "
